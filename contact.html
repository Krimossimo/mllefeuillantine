<!doctype html><html lang="fr"><head><title>Contact · Mllefeuillantine</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body>
<main class="wrap sec narrow"><h1>Nous écrire</h1><p class="sub">Une question ou un projet sur mesure ? Décrivez-le pour recevoir un devis : prévoir 4 jours à l'avance pour une pièce, 1 semaine pour plus d'une pièce.</p>
<form id="contact-form" class="form"><label>Nom<input name="nom" required autocomplete="name"></label>
<label>E-mail<input name="email" type="email" required autocomplete="email"></label>
<label>Message<textarea name="message" rows="6" required></textarea></label>
<button class="btn" type="submit">Envoyer le message</button><p class="msg" role="status"></p></form></main>
<script src="js/config.js"></script><script src="js/products.js"></script><script src="js/app.js"></script></body></html>
